<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Green Screen Video</title>

  <!-- AFRAME -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>

  <!-- XR Extras -->
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- 8thWall Engine -->
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- IMAGE TARGET -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData: [{
          name: "my-poster",
          type: "PLANAR",
          imagePath: "../assets/Targets/banksy2.png",

          properties: {
            left: 0,
            top: 0,

            width: 1024,
            height: 1536,

            originalWidth: 1024,
            originalHeight: 1536,

            isRotated: false
          }
        }]
      });
    };

    window.XR8
      ? onxrloaded()
      : window.addEventListener("xrloaded", onxrloaded);
  </script>

  <!-- VIDEO PLAYBACK -->
  <script>
    AFRAME.registerComponent("video-playback-on-scan", {
      schema: {
        video: { type: "selector" }
      },

      init: function () {
        this.video = this.data.video;

        if (!this.video) return;

        this.video.pause();

        this.onFound = async () => {
          try {
            this.video.currentTime = 0;
            await this.video.play();
          } catch (e) {
            console.log(e);
          }
        };

        this.onLost = () => {
          this.video.pause();
        };

        this.el.sceneEl.addEventListener(
          "xrimagefound",
          this.onFound
        );

        this.el.sceneEl.addEventListener(
          "xrimagelost",
          this.onLost
        );
      }
    });
  </script>

  <!-- GREEN SCREEN SHADER -->
   <!-- Chromakey Shader -->
   <script>
    AFRAME.registerShader('chromakey', {
      schema: {
        src: {type: 'map'},
        color: {type: 'color', default: '#00FF00'},
        chroma: {type: 'bool', default: true},
        transparent: {default: true}
      },

      init: function (data) {
        const videoEl = data.src;
        if (!videoEl) { return; }

        var videoTexture = new THREE.VideoTexture(videoEl);
        videoTexture.minFilter = THREE.LinearFilter;
        this.material = new THREE.ShaderMaterial({
          transparent: data.transparent,
          uniforms: {
            chroma: { type: 'b', value: data.chroma },
            color: { type: 'c', value: new THREE.Color(data.color) },
            myTexture: { type: 't', value: videoTexture }
          },
          vertexShader: this.vertexShader,
          fragmentShader: this.fragmentShader
        });
      },

      update: function (data) {
        this.material.uniforms.chroma.value = data.chroma;
        this.material.uniforms.color.value.set(data.color);
        this.material.transparent = data.transparent;
      },

      vertexShader: [
        'varying vec2 vUv;',
        'void main(void) {',
        '  vUv = uv;',
        '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
        '}'
      ].join('\n'),

      fragmentShader: [
        'uniform sampler2D myTexture;',
        'uniform vec3 color;',
        'uniform bool chroma;',
        'varying vec2 vUv;',
        'void main(void) {',
        '  vec3 tColor = texture2D(myTexture, vUv).rgb;',
        '  float a = 1.0;',
        '  if (chroma) {',
        '    a = (length(tColor - color) - 0.55) * 7.0;',
        '  }',
        '  gl_FragColor = vec4(tColor, a);',
        '}'
      ].join('\n')
    });
  </script>

</head>

<body>

<a-scene
  xrextras-loading
  xrextras-runtime-error
  xrweb="disableWorldTracking: true">

  <!-- ASSETS -->
  <a-assets>

    <video
      id="vid"
      src="../assets/Targets/greenback.mp4"

      preload="auto"
      autoplay
      loop
      muted

      playsinline
      webkit-playsinline

      crossorigin="anonymous">
    </video>

  </a-assets>



  <!-- IMAGE TARGET -->
 

  
  <xrextras-named-image-target name="my-poster" video-playback-on-scan="video: #vid">
    <a-entity
      geometry="primitive: plane; width: 0.7; height: 1.05"
      material="shader: chromakey; src: #vid; chroma: true; color: #61B050;"
      position="0 0.1 0">
    </a-entity>
  </xrextras-named-image-target>

    <!-- CAMERA -->
    <a-camera position="0 4 10"></a-camera>

</a-scene>

</body>
</html>
