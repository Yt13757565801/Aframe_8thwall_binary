<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Video</title>

  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData: [{
          name: "my-poster",
          type: "PLANAR",
          imagePath: "../assets/Targets/banksy2.png",
          properties: {
            left: 0,
            top: 0,
            width: 1024,
            height: 1536,
            originalWidth: 1024,
            originalHeight: 1536,
            isRotated: false
          }
        }]
      });
    };

    window.XR8 ? onxrloaded() : window.addEventListener("xrloaded", onxrloaded);
  </script>

  <script>
    AFRAME.registerComponent("video-playback-on-scan", {
      schema: {
        video: { type: "selector" }
      },

      init: function () {
        this.video = this.data.video;
        if (!this.video) return;

        this.video.pause();

        this.onFound = async () => {
          try {
            this.video.muted = true;
            this.video.playsInline = true;
            this.video.currentTime = 0;
            await this.video.play();
          } catch (e) {
            console.log("Video play failed:", e);
          }
        };

        this.onLost = () => {
          this.video.pause();
        };

        this.el.sceneEl.addEventListener("xrimagefound", this.onFound);
        this.el.sceneEl.addEventListener("xrimagelost", this.onLost);
      }
    });
  </script>
</head>

<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <a-assets>
      <video
        id="vid"
        src="../assets/Targets/finalvideo.mp4"
        loop
        muted
        autoplay
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target
      name="my-poster"
      video-playback-on-scan="video: #vid">

      <a-entity
        geometry="primitive: plane; width: 0.68; height:1.02"
        material="shader: flat; src: #vid; transparent: true;"
        position="0 0 0.02">
      </a-entity>

    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
