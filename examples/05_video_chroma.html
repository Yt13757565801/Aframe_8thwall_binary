<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Green Screen Video</title>

  <!-- AFRAME -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>

  <!-- XR Extras -->
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- 8thWall Engine -->
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- IMAGE TARGET -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData: [{
          name: "my-poster",
          type: "PLANAR",
          imagePath: "../assets/Targets/banksy2.png",

          properties: {
            left: 0,
            top: 0,

            width: 1024,
            height: 1536,

            originalWidth: 1024,
            originalHeight: 1536,

            isRotated: false
          }
        }]
      });
    };

    window.XR8
      ? onxrloaded()
      : window.addEventListener("xrloaded", onxrloaded);
  </script>

  <!-- VIDEO PLAYBACK -->
  <script>
    AFRAME.registerComponent("video-playback-on-scan", {
      schema: {
        video: { type: "selector" }
      },

      init: function () {
        this.video = this.data.video;

        if (!this.video) return;

        this.video.pause();

        this.onFound = async () => {
          try {
            this.video.currentTime = 0;
            await this.video.play();
          } catch (e) {
            console.log(e);
          }
        };

        this.onLost = () => {
          this.video.pause();
        };

        this.el.sceneEl.addEventListener(
          "xrimagefound",
          this.onFound
        );

        this.el.sceneEl.addEventListener(
          "xrimagelost",
          this.onLost
        );
      }
    });
  </script>

  <!-- GREEN SCREEN SHADER -->
  <script>
    AFRAME.registerShader('chromakey', {

      schema: {
        src: { type: 'map' },
        color: {
          type: 'color',
          default: '#00FF00'
        },
        transparent: {
          default: true
        }
      },

      init: function (data) {

        const video = data.src;

        const texture =
          new THREE.VideoTexture(video);

        texture.minFilter =
          THREE.LinearFilter;

        this.material =
          new THREE.ShaderMaterial({

          transparent: true,

          uniforms: {

            color: {
              value:
                new THREE.Color(data.color)
            },

            texture: {
              value: texture
            }
          },

          vertexShader: `

            varying vec2 vUv;

            void main() {

              vUv = uv;

              gl_Position =
                projectionMatrix *
                modelViewMatrix *
                vec4(position,1.0);

            }

          `,

          fragmentShader: `

            uniform sampler2D texture;
            uniform vec3 color;

            varying vec2 vUv;

            void main() {

              vec4 tColor =
                texture2D(texture, vUv);

              float diff =
                distance(
                  tColor.rgb,
                  color
                );

              if(diff < 0.55){
                discard;
              }

              gl_FragColor = tColor;

            }

          `
        });
      }
    });
  </script>

</head>

<body>

<a-scene
  xrextras-loading
  xrextras-runtime-error
  xrweb="disableWorldTracking: true">

  <!-- ASSETS -->
  <a-assets>

    <video
      id="vid"
      src="../assets/Targets/green back.mp4"

      preload="auto"
      autoplay
      loop
      muted

      playsinline
      webkit-playsinline

      crossorigin="anonymous">
    </video>

  </a-assets>

  <!-- CAMERA -->
  <a-camera position="0 4 10"></a-camera>

  <!-- IMAGE TARGET -->
  <xrextras-named-image-target
    name="my-poster"
    video-playback-on-scan="video: #vid">

    <!-- VIDEO -->
    <a-entity

      geometry="
        primitive: plane;
        width: 0.7;
        height: 1.05
      "

      material="
        shader: chromakey;
        src: #vid;
        color: #00FF00;
      "

      position="0 0 0.02">

    </a-entity>

  </xrextras-named-image-target>

</a-scene>

</body>
</html>
