<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>One QR - Different Patterns for Different Targets</title>

  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        // 限制最大同时追踪的数量为 1，防止画面混乱
      
        
        "imageTargetData":[
          {
            "name": "banksy-1",
            "type": "PLANAR",
            "imagePath": "../assets/Targets/banksy1.png", 
            "properties": { "left": 0, "top": 0, "width": 1024, "height": 576, "originalWidth": 1024, "originalHeight": 576, "isRotated": false }
          },
          {
            "name": "banksy-2",
            "type": "PLANAR",
            "imagePath": "../assets/Targets/banksy2.png", 
            "properties": { "left": 0, "top": 0, "width": 830, "height": 830, "originalWidth": 830, "originalHeight": 830, "isRotated": false }
          },
          {
            "name": "banksy-3",
            "type": "PLANAR",
            "imagePath": "../assets/Targets/banksy3.png", 
            "properties": { "left": 0, "top": 0, "width": 1200, "height": 800, "originalWidth": 1200, "originalHeight": 800, "isRotated": false }
          }
        ]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <a-assets>
      <img id="pattern1" src="../assets/export1.png" crossorigin="anonymous">
       <img id="pattern2" src="../assets/Targets/dog.png" crossorigin="anonymous"> 
       <img id="pattern3" src="../assets/export3.png" crossorigin="anonymous"> 
      </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target name="banksy-1">
      <a-image src="#pattern1" position="0.1 0.18 0.01" width="0.26" height="0.45"></a-image>
      <a-text value="Target A" color="red" align="center"
      position="0 0 0" width="3"></a-text>
    </xrextras-named-image-target>

    <xrextras-named-image-target name="banksy-2">
      <a-image src="#pattern2" position="0 0.31 0.01" width="0.35" height="0.32"></a-image>
      <a-text value="Target B" color="red" align="center"
      position="0 0 0" width="3"></a-text>
    </xrextras-named-image-target>

    <xrextras-named-image-target name="banksy-3">
      <a-image src="#pattern3" position="0.18 0.26 0.01" width="0.11" height="0.24"></a-image>
      <a-text value="Target C" color="red" align="center"
      position="0 0 0" width="3"></a-text>
    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
